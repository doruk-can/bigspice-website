# Build the site and publish it to GitHub Pages on every push to main.
#
# The `verify` step is the point of this file as much as the deploy is: it is
# the guard that stops a bracketed placeholder, a lost legal anchor, a title
# over 60 characters or a share card pointing at the wrong language from ever
# reaching the web. If it fails, nothing is published.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time, and never cancel one half-way
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 22: verify.mjs imports the .ts content files directly and
          # relies on Node stripping the types, which is only unflagged from
          # 22.18. Pinning the major that certainly has it removes the guess.
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      # No `configure-pages` step. It exists to hand a framework the base path
      # for a project site; this one is served at the apex of its own domain
      # and sets `site` itself, so nothing here reads its output — while it is
      # the one step that fails outright if Pages has not been switched to
      # "GitHub Actions" yet, taking the whole build down with it.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
